<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sandals Shop - Premium Sandal Collection</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            color: #333;
        }

        header {
            background-color: #2c3e50;
            color: white;
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 2rem;
        }

        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav button {
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1rem;
            padding: 0.5rem 1rem;
            border-radius: 4px;
            transition: background-color 0.3s;
        }

        nav button:hover {
            background-color: rgba(255,255,255,0.1);
        }

        nav button.active {
            background-color: #3498db;
        }

        .cart-badge {
            background-color: #e74c3c;
            color: white;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            position: absolute;
            top: 10px;
            right: 10px;
        }

        .cart-button {
            position: relative;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }

        .section {
            display: none;
        }

        .section.active {
            display: block;
        }

        /* Shop Section */
        .filters {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .filter-group label {
            font-weight: 600;
            font-size: 0.9rem;
        }

        .filter-group select,
        .filter-group input {
            padding: 0.5rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 0.9rem;
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 2rem;
            margin-bottom: 2rem;
        }

        .product-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .product-image {
            width: 100%;
            height: 200px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }

        .product-info {
            padding: 1.5rem;
        }

        .product-name {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .product-description {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .product-details {
            font-size: 0.85rem;
            color: #999;
            margin-bottom: 1rem;
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .product-details span {
            background-color: #f0f0f0;
            padding: 0.25rem 0.75rem;
            border-radius: 12px;
        }

        .product-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .product-price {
            font-size: 1.5rem;
            font-weight: bold;
            color: #e74c3c;
        }

        .product-actions {
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .qty-input {
            width: 50px;
            padding: 0.25rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            text-align: center;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border: none;
            border-radius: 4px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .btn-primary {
            background-color: #3498db;
            color: white;
        }

        .btn-primary:hover {
            background-color: #2980b9;
        }

        .btn-success {
            background-color: #27ae60;
            color: white;
        }

        .btn-success:hover {
            background-color: #229954;
        }

        .btn-danger {
            background-color: #e74c3c;
            color: white;
        }

        .btn-danger:hover {
            background-color: #c0392b;
        }

        .btn-secondary {
            background-color: #95a5a6;
            color: white;
        }

        .btn-secondary:hover {
            background-color: #7f8c8d;
        }

        .btn-small {
            padding: 0.5rem 1rem;
            font-size: 0.85rem;
        }

        /* Cart Section */
        .cart-container {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .cart-items {
            margin-bottom: 2rem;
        }

        .cart-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid #eee;
            gap: 1rem;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }

        .cart-item-price {
            color: #e74c3c;
            font-size: 0.9rem;
        }

        .cart-item-actions {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .cart-empty {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .cart-summary {
            background-color: #f9f9f9;
            padding: 1.5rem;
            border-radius: 8px;
            margin-top: 2rem;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1rem;
            font-size: 1.1rem;
        }

        .summary-total {
            display: flex;
            justify-content: space-between;
            font-size: 1.3rem;
            font-weight: bold;
            color: #e74c3c;
            padding-top: 1rem;
            border-top: 2px solid #ddd;
        }

        .cart-actions {
            display: flex;
            gap: 1rem;
            margin-top: 2rem;
            justify-content: center;
        }

        /* Checkout Section */
        .checkout-form {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            max-width: 600px;
            margin: 0 auto;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 100px;
        }

        .order-summary {
            background-color: #f9f9f9;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }

        .order-success {
            background-color: #d4edda;
            border: 1px solid #c3e6cb;
            color: #155724;
            padding: 1.5rem;
            border-radius: 8px;
            margin-bottom: 2rem;
            text-align: center;
        }

        .order-number {
            font-size: 1.5rem;
            font-weight: bold;
            margin: 1rem 0;
        }

        /* Orders Section */
        .orders-container {
            background: white;
            border-radius: 8px;
            padding: 2rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .order-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .order-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        .order-id {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .order-status {
            padding: 0.5rem 1rem;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-pending {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-shipped {
            background-color: #d1ecf1;
            color: #0c5460;
        }

        .status-delivered {
            background-color: #d4edda;
            color: #155724;
        }

        .order-details {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 1rem;
        }

        .order-details-row {
            margin-bottom: 0.5rem;
        }

        .order-items {
            border-top: 1px solid #eee;
            padding-top: 1rem;
        }

        .order-item {
            display: flex;
            justify-content: space-between;
            padding: 0.5rem 0;
            font-size: 0.9rem;
        }

        .no-data {
            text-align: center;
            padding: 3rem;
            color: #999;
        }

        .alert {
            padding: 1rem;
            border-radius: 4px;
            margin-bottom: 1rem;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .search-box {
            margin-bottom: 2rem;
        }

        .search-box input {
            width: 100%;
            max-width: 400px;
            padding: 0.75rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            .products-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 1rem;
            }

            .header-content {
                flex-direction: column;
                gap: 1rem;
            }

            nav {
                width: 100%;
                justify-content: center;
                flex-wrap: wrap;
            }

            .filters {
                flex-direction: column;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-item-actions {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">👡 Sandals Shop</div>
            <nav>
                <button onclick="showSection('shop')" class="nav-btn active">Shop</button>
                <button onclick="showSection('cart')" class="nav-btn">
                    Cart <span id="cart-count" class="cart-badge" style="display: none;">0</span>
                </button>
                <button onclick="showSection('orders')" class="nav-btn">Orders</button>
            </nav>
        </div>
    </header>

    <div class="container">
        <!-- Shop Section -->
        <div id="shop" class="section active">
            <h1 style="margin-bottom: 2rem;">Browse Our Premium Sandal Collection</h1>
            
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Search sandals..." onkeyup="searchProducts()">
            </div>

            <div class="filters">
                <div class="filter-group">
                    <label for="type-filter">Type:</label>
                    <select id="type-filter" onchange="filterProducts()">
                        <option value="">All Types</option>
                        <option value="Flip Flop">Flip Flop</option>
                        <option value="Slide">Slide</option>
                        <option value="Strappy">Strappy</option>
                        <option value="Sport">Sport</option>
                        <option value="Slip-on">Slip-on</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="color-filter">Color:</label>
                    <select id="color-filter" onchange="filterProducts()">
                        <option value="">All Colors</option>
                        <option value="Black">Black</option>
                        <option value="Blue">Blue</option>
                        <option value="Red">Red</option>
                        <option value="White">White</option>
                        <option value="Brown">Brown</option>
                    </select>
                </div>

                <div style="margin-top: auto;">
                    <button class="btn btn-secondary btn-small" onclick="resetFilters()">Reset Filters</button>
                </div>
            </div>

            <div id="products-container" class="products-grid">
                <!-- Products will be loaded here -->
            </div>
        </div>

        <!-- Cart Section -->
        <div id="cart" class="section">
            <h1 style="margin-bottom: 2rem;">Shopping Cart</h1>
            
            <div class="cart-container">
                <div id="cart-items-container" class="cart-items">
                    <div class="cart-empty">Your cart is empty</div>
                </div>

                <div id="cart-summary" class="cart-summary" style="display: none;">
                    <div class="summary-row">
                        <span>Items:</span>
                        <span id="items-count">0</span>
                    </div>
                    <div class="summary-total">
                        <span>Total:</span>
                        <span id="cart-total">$0.00</span>
                    </div>
                </div>

                <div class="cart-actions">
                    <button class="btn btn-secondary" onclick="continueShopping()">Continue Shopping</button>
                    <button class="btn btn-success" id="checkout-btn" style="display: none;" onclick="showSection('checkout')">Proceed to Checkout</button>
                </div>
            </div>
        </div>

        <!-- Checkout Section -->
        <div id="checkout" class="section">
            <h1 style="margin-bottom: 2rem;">Checkout</h1>
            
            <div class="checkout-form">
                <div id="order-success" class="order-success" style="display: none;">
                    <div>✓ Order Placed Successfully!</div>
                    <div class="order-number">Order #<span id="order-id">-</span></div>
                    <p>Thank you for your purchase. Your order has been confirmed.</p>
                </div>

                <div id="checkout-form-container" style="display: none;">
                    <div class="order-summary">
                        <h3>Order Summary</h3>
                        <div id="checkout-items"></div>
                        <div class="summary-total" style="margin-top: 1rem;">
                            <span>Total:</span>
                            <span id="checkout-total">$0.00</span>
                        </div>
                    </div>

                    <form onsubmit="placeOrder(event)">
                        <div class="form-group">
                            <label for="customer-name">Full Name *</label>
                            <input type="text" id="customer-name" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-email">Email Address *</label>
                            <input type="email" id="customer-email" required>
                        </div>

                        <div class="form-group">
                            <label for="customer-phone">Phone Number *</label>
                            <input type="tel" id="customer-phone" required>
                        </div>

                        <div class="form-group">
                            <label for="shipping-address">Shipping Address *</label>
                            <textarea id="shipping-address" required></textarea>
                        </div>

                        <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                            <button type="button" class="btn btn-secondary" onclick="backToCart()">Back to Cart</button>
                            <button type="submit" class="btn btn-success" style="flex: 1;">Place Order</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>

        <!-- Orders Section -->
        <div id="orders" class="section">
            <h1 style="margin-bottom: 2rem;">Your Orders</h1>
            
            <div class="orders-container">
                <div class="search-box">
                    <input type="email" id="order-email-input" placeholder="Enter email to view orders" onkeyup="searchOrders()">
                </div>
                <div id="orders-list"></div>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8080/api';
        const SESSION_ID = 'default-session';
        let allProducts = [];
        let cartItems = [];

        // Initialize app
        window.addEventListener('load', () => {
            loadProducts();
            loadCart();
        });

        // Navigation
        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(sectionId).classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');

            if (sectionId === 'checkout') {
                prepareCheckout();
            } else if (sectionId === 'orders') {
                loadOrders();
            }
        }

        // Products
        async function loadProducts() {
            try {
                const response = await fetch(`${API_URL}/products`);
                allProducts = await response.json();
                displayProducts(allProducts);
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }

        function displayProducts(products) {
            const container = document.getElementById('products-container');
            if (products.length === 0) {
                container.innerHTML = '<div class="cart-empty">No products found</div>';
                return;
            }

            container.innerHTML = products.map(product => `
                <div class="product-card">
                    <div class="product-image">👡</div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-description">${product.description}</div>
                        <div class="product-details">
                            <span>${product.type}</span>
                            <span>${product.color}</span>
                            <span>Size: ${product.size}</span>
                        </div>
                        <div class="product-footer">
                            <div class="product-price">$${product.price.toFixed(2)}</div>
                            <div class="product-actions">
                                <input type="number" class="qty-input" value="1" min="1" id="qty-${product.id}">
                                <button class="btn btn-primary btn-small" onclick="addToCart(${product.id})">Add</button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function addToCart(productId) {
            const quantity = parseInt(document.getElementById(`qty-${productId}`).value);
            try {
                const response = await fetch(`${API_URL}/cart/add?sessionId=${SESSION_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ productId, quantity })
                });
                if (response.ok) {
                    loadCart();
                    showAlert('Added to cart!', 'success');
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
                showAlert('Failed to add to cart', 'error');
            }
        }

        // Cart
        async function loadCart() {
            try {
                const response = await fetch(`${API_URL}/cart?sessionId=${SESSION_ID}`);
                cartItems = await response.json();
                displayCart();
                updateCartCount();
            } catch (error) {
                console.error('Error loading cart:', error);
            }
        }

        function displayCart() {
            const container = document.getElementById('cart-items-container');
            const summaryDiv = document.getElementById('cart-summary');
            const checkoutBtn = document.getElementById('checkout-btn');

            if (cartItems.length === 0) {
                container.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
                summaryDiv.style.display = 'none';
                checkoutBtn.style.display = 'none';
                return;
            }

            summaryDiv.style.display = 'block';
            checkoutBtn.style.display = 'block';

            let total = 0;
            container.innerHTML = cartItems.map(item => {
                total += item.subtotal;
                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <div class="cart-item-name">${item.productName}</div>
                            <div class="cart-item-price">$${item.productPrice.toFixed(2)} × ${item.quantity}</div>
                        </div>
                        <div class="cart-item-actions">
                            <input type="number" class="qty-input" value="${item.quantity}" min="1" onchange="updateQuantity(${item.id}, this.value)">
                            <button class="btn btn-danger btn-small" onclick="removeFromCart(${item.id})">Remove</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('items-count').textContent = cartItems.length;
            document.getElementById('cart-total').textContent = `$${total.toFixed(2)}`;
        }

        async function updateQuantity(cartItemId, quantity) {
            try {
                await fetch(`${API_URL}/cart/${cartItemId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ quantity: parseInt(quantity) })
                });
                loadCart();
            } catch (error) {
                console.error('Error updating quantity:', error);
            }
        }

        async function removeFromCart(cartItemId) {
            try {
                await fetch(`${API_URL}/cart/${cartItemId}`, { method: 'DELETE' });
                loadCart();
            } catch (error) {
                console.error('Error removing from cart:', error);
            }
        }

        function updateCartCount() {
            const badge = document.getElementById('cart-count');
            if (cartItems.length > 0) {
                badge.textContent = cartItems.length;
                badge.style.display = 'flex';
            } else {
                badge.style.display = 'none';
            }
        }

        function continueShopping() {
            showSection('shop');
        }

        // Filters
        function filterProducts() {
            const type = document.getElementById('type-filter').value;
            const color = document.getElementById('color-filter').value;

            let filtered = allProducts;

            if (type) {
                filtered = filtered.filter(p => p.type === type);
            }
            if (color) {
                filtered = filtered.filter(p => p.color === color);
            }

            displayProducts(filtered);
        }

        function searchProducts() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allProducts.filter(p => 
                p.name.toLowerCase().includes(query) ||
                p.description.toLowerCase().includes(query)
            );
            displayProducts(filtered);
        }

        function resetFilters() {
            document.getElementById('search-input').value = '';
            document.getElementById('type-filter').value = '';
            document.getElementById('color-filter').value = '';
            displayProducts(allProducts);
        }

        // Checkout
        function prepareCheckout() {
            const formContainer = document.getElementById('checkout-form-container');
            const successDiv = document.getElementById('order-success');

            if (successDiv.style.display === 'block') {
                formContainer.style.display = 'none';
                return;
            }

            formContainer.style.display = 'block';
            successDiv.style.display = 'none';

            let total = 0;
            const itemsHtml = cartItems.map(item => {
                total += item.subtotal;
                return `
                    <div class="order-item">
                        <span>${item.productName} × ${item.quantity}</span>
                        <span>$${item.subtotal.toFixed(2)}</span>
                    </div>
                `;
            }).join('');

            document.getElementById('checkout-items').innerHTML = itemsHtml;
            document.getElementById('checkout-total').textContent = `$${total.toFixed(2)}`;
        }

        async function placeOrder(event) {
            event.preventDefault();

            const order = {
                customerName: document.getElementById('customer-name').value,
                customerEmail: document.getElementById('customer-email').value,
                customerPhone: document.getElementById('customer-phone').value,
                shippingAddress: document.getElementById('shipping-address').value
            };

            try {
                const response = await fetch(`${API_URL}/orders/checkout?sessionId=${SESSION_ID}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(order)
                });

                if (response.ok) {
                    const result = await response.json();
                    document.getElementById('order-id').textContent = result.id;
                    document.getElementById('checkout-form-container').style.display = 'none';
                    document.getElementById('order-success').style.display = 'block';
                    
                    cartItems = [];
                    updateCartCount();

                    setTimeout(() => {
                        showSection('shop');
                        document.getElementById('order-success').style.display = 'none';
                        document.getElementById('checkout-form-container').style.display = 'block';
                    }, 3000);
                }
            } catch (error) {
                console.error('Error placing order:', error);
                showAlert('Failed to place order', 'error');
            }
        }

        function backToCart() {
            showSection('cart');
        }

        // Orders
        async function loadOrders() {
            document.getElementById('orders-list').innerHTML = '<div class="no-data">Enter your email to view orders</div>';
        }

        async function searchOrders() {
            const email = document.getElementById('order-email-input').value.trim();
            if (!email) {
                document.getElementById('orders-list').innerHTML = '<div class="no-data">Enter your email to view orders</div>';
                return;
            }

            try {
                const response = await fetch(`${API_URL}/orders/customer/${email}`);
                const orders = await response.json();

                if (orders.length === 0) {
                    document.getElementById('orders-list').innerHTML = '<div class="no-data">No orders found for this email</div>';
                    return;
                }

                const ordersHtml = orders.map(order => `
                    <div class="order-card">
                        <div class="order-header">
                            <div class="order-id">Order #${order.id}</div>
                            <div class="order-status status-${order.status.toLowerCase()}">${order.status}</div>
                        </div>
                        <div class="order-details">
                            <div class="order-details-row"><strong>Date:</strong> ${new Date(order.orderDate).toLocaleDateString()}</div>
                            <div class="order-details-row"><strong>Customer:</strong> ${order.customerName}</div>
                            <div class="order-details-row"><strong>Email:</strong> ${order.customerEmail}</div>
                            <div class="order-details-row"><strong>Address:</strong> ${order.shippingAddress}</div>
                        </div>
                        <div class="order-items">
                            <strong>Items:</strong>
                            ${order.items.map(item => `
                                <div class="order-item">
                                    <span>${item.productName} × ${item.quantity}</span>
                                    <span>$${item.subtotal.toFixed(2)}</span>
                                </div>
                            `).join('')}
                            <div class="summary-total" style="margin-top: 0.5rem; font-size: 1rem;">
                                <span>Total:</span>
                                <span>$${order.totalPrice.toFixed(2)}</span>
                            </div>
                        </div>
                    </div>
                `).join('');

                document.getElementById('orders-list').innerHTML = ordersHtml;
            } catch (error) {
                console.error('Error loading orders:', error);
                document.getElementById('orders-list').innerHTML = '<div class="no-data">Error loading orders</div>';
            }
        }

        // Utility
        function showAlert(message, type) {
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            document.body.insertBefore(alert, document.body.firstChild);
            setTimeout(() => alert.remove(), 3000);
        }
    </script>
</body>
</html>
