<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle}">Watch Shop</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="logo">
                <i class="fas fa-gem"></i>
                <span>LUXE WATCHES</span>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link">Home</a>
                <a href="/catalog" class="nav-link">Collection</a>
                <a href="/catalog?category=Luxury" class="nav-link">Luxury</a>
                <a href="/catalog?category=Sport" class="nav-link">Sport</a>
            </div>
            <div class="nav-actions">
                <a href="/cart" class="cart-link">
                    <i class="fas fa-shopping-bag"></i>
                    <span class="cart-count" th:text="${cartItemCount}">0</span>
                </a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main th:replace="${content}">
        <!-- Page content goes here -->
    </main>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-section">
                <h3>LUXE WATCHES</h3>
                <p>Premium timepieces for discerning collectors</p>
            </div>
            <div class="footer-section">
                <h4>Shop</h4>
                <a href="/catalog">All Watches</a>
                <a href="/catalog?category=Luxury">Luxury</a>
                <a href="/catalog?category=Sport">Sport</a>
                <a href="/catalog?category=Dress">Dress</a>
            </div>
            <div class="footer-section">
                <h4>Contact</h4>
                <p><i class="fas fa-envelope"></i> info@luxewatches.com</p>
                <p><i class="fas fa-phone"></i> +1 (555) 123-4567</p>
            </div>
            <div class="footer-section">
                <h4>Follow Us</h4>
                <div class="social-links">
                    <a href="#"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-facebook"></i></a>
                    <a href="#"><i class="fab fa-twitter"></i></a>
                </div>
            </div>
        </div>
        <div class="footer-bottom">
            <p>&copy; 2024 LUXE WATCHES. All rights reserved.</p>
        </div>
    </footer>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
