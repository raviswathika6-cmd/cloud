<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Admission Application</title>
    <link rel="stylesheet" href="/static/css/shared.css">
    <style>
        .container { max-width: 800px; }
        textarea { height: 150px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>College Admission Form</h1>
        <form id="admissionForm">
            <div class="form-group">
                <label for="first_name">First Name</label>
                <input type="text" id="first_name" required>
            </div>
            <div class="form-group">
                <label for="last_name">Last Name</label>
                <input type="text" id="last_name" required>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label for="date_of_birth">Date of Birth</label>
                <input type="date" id="date_of_birth" required>
            </div>
            <div class="form-group">
                <label for="high_school">High School</label>
                <input type="text" id="high_school" required>
            </div>
            <div class="form-group">
                <label for="gpa">High School GPA</label>
                <input type="number" step="0.01" id="gpa" required>
            </div>
            <div class="form-group">
                <label for="major">Intended Major</label>
                <select id="major" required>
                    <option value="">Select a major</option>
                    <option value="Computer Science">Computer Science</option>
                    <option value="Biology">Biology</option>
                    <option value="Engineering">Engineering</option>
                    <option value="Business">Business</option>
                    <option value="Art">Art</option>
                </select>
            </div>
            <div class="form-group">
                <label for="essay">Personal Statement (Essay)</label>
                <textarea id="essay" required placeholder="Tell us about yourself and your goals..."></textarea>
            </div>
            <button type="submit" class="btn-primary">Submit Application</button>
        </form>
        <div id="message" class="msg"></div>
    </div>

    <script src="/static/js/utils.js"></script>
    <script>
        setupFormSubmit(
            'admissionForm',
            '/api/apply',
            ['first_name', 'last_name', 'email', 'date_of_birth',
             'high_school', 'gpa', 'major', 'essay'],
            function(result) {
                showMessage('message',
                    'Application submitted successfully! Application ID: ' + result.id,
                    'success');
                document.getElementById('admissionForm').reset();
            }
        );
    </script>
</body>
</html>
